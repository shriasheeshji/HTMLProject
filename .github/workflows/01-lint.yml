name: Lint Static Content

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Validate HTML Files
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Step 2 - Display Environment Information
        run: |
          echo "===================================="
          echo "Running on GitHub Actions"
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit ID  : ${{ github.sha }}"
          echo "===================================="

      - name: Step 3 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Step 4 - Verify Node and NPM Versions
        run: |
          echo "Checking Node.js installation..."
          node --version
          npm --version

      - name: Step 5 - Install HTMLHint
        run: |
          echo "Installing HTMLHint..."
          npm install -g htmlhint
          echo "HTMLHint installed successfully."

      - name: Step 6 - Lint HTML Files
        run: |
          echo "Starting HTML validation..."
          htmlhint "**/*.html"
          echo "HTML validation completed successfully."

      - name: Step 7 - Workflow Completed
        run: |
          echo "===================================="
          echo "HTML linting completed successfully."
          echo "Workflow finished without errors."
          echo "===================================="

      # Uncomment when CSS linting is configured
